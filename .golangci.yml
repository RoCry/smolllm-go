version: "2"

run:
  go: "1.27"
  timeout: 5m
  modules-download-mode: readonly
  tests: true

output:
  formats:
    text:
      colors: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable:
    - depguard
  enable:
    - errcheck
    - errorlint
    - exhaustruct_v5
    - goconst
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - nolintlint
    - paralleltest
    - revive
    - sloglint
    - staticcheck
    - testifylint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # Closing an already-drained response body or reader has nothing useful to
      # report and nothing to do about it. Excluded explicitly so the code can
      # say `defer resp.Body.Close()` instead of hiding it in a blank assignment.
      exclude-functions:
        - (io.Closer).Close
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    revive:
      severity: error
      rules:
        - name: exported
          severity: error
        - name: indent-error-flow
        - name: errorf
        - name: var-naming
        - name: receiver-naming
        - name: empty-lines
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/rocry/smolllm-go
